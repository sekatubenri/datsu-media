name: Auto Generate Article

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Anthropic SDK
        run: npm install
        working-directory: generator

      # media-ops: ネタ補充（ネタ収集担当）とリンク枠の用意（リンク担当）。失敗しても記事生成は続ける
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: sekatubenri/media-ops
          path: .ops

      - name: Prepare topics and links
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm ci --prefix .ops && node .ops/src/site/prepare.js --site datsu --dir .

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generator/generate.js

      - name: Commit new article
        run: |
          git config user.name "auto-article-bot"
          git config user.email "bot@example.com"
          git add content/ unused-topics.json
          git diff --staged --quiet || git commit -m "Auto-generate: $(date +%Y-%m-%d)"
          git push
